name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # 1つのバージョンで落ちても他のバージョンの結果を得たい
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # バージョンは package.json の packageManager から読む

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: task build

      # 手元と同じ確認にするため、個別のコマンドではなく task check を呼ぶ
      - name: Check
        run: task check

      # task check の format で差分が出たら、書式が崩れたままコミットされている
      - name: Check format
        run: git diff --exit-code
