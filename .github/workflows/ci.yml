name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # 1つのバージョンで落ちても他のバージョンの結果を得たい
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # バージョンは package.json の packageManager から読む

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build # viewer の tsc -b と cli の tsc で型チェックも兼ねる

      - name: Typecheck schema
        run: pnpm --filter @graphler/schema typecheck

      - name: Lint
        run: pnpm --filter @graphler/viewer lint

      - name: Test
        run: pnpm -r test
